{% extends "base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h2>Change Password</h2>
        <p>Update your Library Management System account password.</p>
    </div>
    <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
</div>

<div class="form-card form-card-small">
    <form action="{{ url_for('change_password_route') }}" method="POST">
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="Enter new password" minlength="6" autocomplete="new-password" required>
            <small class="form-help">Password must contain at least 6 characters.</small>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Retype new password" minlength="6" autocomplete="new-password" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Update Password</button>
            <a href="{{ url_for('student_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
